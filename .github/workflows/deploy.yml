name: Deploy to GitHub Pages

# 推送到 main 分支时触发：构建静态文件并发布到 gh-pages 分支
on:
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write   # 推送 gh-pages 分支需要
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消进行中的旧构建
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # .nojekyll：绕过 GitHub Pages 的 Jekyll 处理，确保下划线资源正常发布
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # 发布到 gh-pages 分支（force orphan：每次全量覆盖，分支保持单提交）
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: build from ${{ github.sha }}'
